<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Quick SSO</title>
<style>
  :root{
    --bg:#faf9fc;
    --surface:#ffffff;
    --border:rgba(0,0,0,.08);
    --text:#131920;
    --muted:#6b7280;
    --primary:#4200db;
    --primary-dark:#35009e;
    --primary-bg:#efeaff;
    --radius:16px;
    --shadow:0 10px 30px -12px rgba(66,0,219,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(66,0,219,.08), transparent 60%),
      radial-gradient(700px 400px at 0% 10%, rgba(133,117,255,.10), transparent 55%),
      var(--bg);
    color:var(--text);
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:72px 24px 60px}

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;color:var(--primary-dark);
    background:var(--primary-bg);border:1px solid rgba(66,0,219,.15);
    padding:6px 14px;border-radius:999px;margin-bottom:20px;font-weight:600;
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary)}

  h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.3px;margin-bottom:10px}
  p.lead{color:var(--muted);font-size:15.5px;max-width:520px;margin-bottom:40px}

  .cards{display:grid;gap:16px}

  .card{
    display:flex;align-items:center;gap:18px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    text-decoration:none;color:var(--text);
    box-shadow:0 1px 2px rgba(0,0,0,.03);
    transition:.2s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
    border-color:rgba(66,0,219,.25);
  }
  .card .ico{
    flex:0 0 auto;
    width:46px;height:46px;border-radius:12px;
    display:grid;place-items:center;font-size:20px;
    background:var(--primary-bg);color:var(--primary);
    font-weight:800;
  }
  .card .body{flex:1;min-width:0}
  .card .title-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .card .title{font-weight:700;font-size:16.5px}
  .card .tag{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;
    background:var(--primary-bg);color:var(--primary-dark);
    letter-spacing:.3px;
  }
  .card .tag.v2{background:#e6f7ee;color:#0f7a4d}
  .card .desc{font-size:13.5px;color:var(--muted)}
  .card .arrow{flex:0 0 auto;color:var(--muted);font-size:18px;transition:.2s}
  .card:hover .arrow{color:var(--primary);transform:translateX(3px)}

  footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px;text-align:center}
  footer a{color:var(--primary-dark);text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge"><span class="dot"></span> Static Pages · GitHub Pages</span>
    <h1>Amazon Quick SSO</h1>
    <p class="lead">导出的对话记录页面，包含两个版本，点击进入查看完整内容。</p>

    <div class="cards">
      <a class="card" href="Amazon_Quick_SSO_.html">
        <div class="ico">1</div>
        <div class="body">
          <div class="title-row">
            <span class="title">Amazon Quick SSO</span>
            <span class="tag">初版</span>
          </div>
          <div class="desc">原始版本对话记录导出页面</div>
        </div>
        <div class="arrow">→</div>
      </a>

      <a class="card" href="Amazon_Quick_SSO_v2_.html">
        <div class="ico">2</div>
        <div class="body">
          <div class="title-row">
            <span class="title">Amazon Quick SSO</span>
            <span class="tag v2">v2</span>
          </div>
          <div class="desc">更新版本对话记录导出页面</div>
        </div>
        <div class="arrow">→</div>
      </a>
      <a class="card" href="quick-sso-manual.html">
        <div class="ico">📘</div>
        <div class="body">
          <div class="title-row">
            <span class="title">Quick SSO 配置手册</span>
            <span class="tag v2">脱敏版</span>
          </div>
          <div class="desc">IAM Federation + Keycloak + AD 集成完整配置指南</div>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>

    <footer>
      Hosted on <a href="https://github.com/lancyli/amazon-quick-sso">github.com/lancyli/amazon-quick-sso</a>
    </footer>
  </div>
</body>
</html>
